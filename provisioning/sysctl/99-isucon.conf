# Complements stock ISUCON13 ansible (pam nofile 655360, ip_local_port_range).
# Apply: sudo ./provisioning/apply.sh

net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Prefer page cache reclaim over swapping under pressure (app + MySQL on same host).
vm.swappiness = 10
