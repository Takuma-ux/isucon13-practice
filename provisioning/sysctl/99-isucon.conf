# Complements stock ISUCON13 ansible (pam nofile 655360, ip_local_port_range).
# Apply: sudo cp provisioning/sysctl/99-isucon.conf /etc/sysctl.d/ && sudo sysctl --system

net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
