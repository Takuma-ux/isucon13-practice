# DB-dedicated host only (ISUCON_HOST_ROLE=db).
# Installed by provisioning/apply.sh — NOT copied on app-only hosts.
#
# vm.swappiness lives here (not in 99-isucon.conf) so it is never overridden by
# a later file in sysctl.d. App hosts get vm.swappiness via 100-isucon-swappiness.conf.

vm.swappiness = 1
