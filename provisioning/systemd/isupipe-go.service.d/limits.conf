[Service]
# Stock unit has no LimitNOFILE; default 1024 is too low under bench load.
LimitNOFILE=65535

# Graceful stop: app drains in-flight HTTP for up to 15s (httpShutdownTimeout in go/main.go).
# Stock systemd DefaultTimeoutStopSec=90s (systemd-system.conf on Ubuntu 22.04 competition AMIs).
# Set below the default but above the app drain so SIGKILL never wins before Shutdown completes.
TimeoutStopSec=30s
