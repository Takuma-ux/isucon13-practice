# Merge into /etc/nginx/nginx.conf (top level + events block).
# Debian default is often worker_processes auto; worker_rlimit_nofile should match
# provisioning/systemd/isupipe-go.service.d/limits.conf (65535).

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}
