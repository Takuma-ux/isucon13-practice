# Reference vhost for u.isucon.dev — merge into /etc/nginx/sites-enabled/ on the target EC2.
# Reload nginx only after nginx -t, with explicit confirmation (see provisioning/README.md).
# No gzip here — avoids double compression if ISUCON13_GZIP=1.

upstream isupipe_app {
    server 127.0.0.1:8080;
    keepalive 256;
    # Default is 60s; must be <= Go http.Server IdleTimeout (75s in main.go).
    keepalive_timeout 60s;
}

server {
  # HTTP/2 over TLS (multiplexing for many concurrent API requests).
  # ISUCON13 EC2 (Ubuntu 22.04, nginx ~1.18): use listen ... http2.
  # nginx >= 1.25.1: use "listen 443 ssl;" plus "http2 on;" in this server block instead.
  listen 443 ssl http2;
  server_name u.isucon.dev;
  server_name *.u.isucon.dev;

  ssl_certificate     /etc/nginx/tls/_.u.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.u.isucon.dev.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  ssl_session_cache shared:SSL:50m;
  ssl_session_timeout 1d;
  ssl_session_tickets on;

  # Default off (bench perf). Diagnostic ALP run: see isupipe.access-log-snippet.conf + conf.d/isucon-alp-logging.conf
  access_log off;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;

  location ^~ /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }

  # POST /api/initialize runs init.sh with up to 120s in Go (subprocess.go); default /api proxy_read_timeout 60s would 504 first.
  location = /api/initialize {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://isupipe_app;

    proxy_connect_timeout 130s;
    proxy_send_timeout 130s;
    proxy_read_timeout 130s;
  }

  location /api {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://isupipe_app;

    # Large JSON list endpoints (search, fills) — avoid tiny default proxy buffers.
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 64 64k;
    proxy_busy_buffers_size 512k;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}
