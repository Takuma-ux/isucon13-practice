# Reference vhost for u.isucon.dev — merge into /etc/nginx/sites-enabled/ on the target EC2.
# Reload nginx only after nginx -t, with explicit confirmation (see provisioning/README.md).
# No gzip here — avoids double compression if ISUCON13_GZIP=1.

upstream isupipe_app {
    server 127.0.0.1:8080;
    keepalive 256;
}

server {
  listen 443 ssl;
  server_name u.isucon.dev;
  server_name *.u.isucon.dev;

  ssl_certificate     /etc/nginx/tls/_.u.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.u.isucon.dev.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Same rationale as ISUCON13_ACCESS_LOG=0 on the app: skip per-request access log I/O.
  access_log off;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;

  location ^~ /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }

  location /api {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://isupipe_app;

    # Large JSON list endpoints (search, fills) — avoid tiny default proxy buffers.
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 64 64k;
    proxy_busy_buffers_size 512k;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}
