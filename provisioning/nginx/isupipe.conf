# Reference: ISUCON13 official vhost (provisioning/ansible/roles/nginx/.../isupipe.conf)
# with upstream keepalive to the app. No gzip here — avoids double compression if ISUCON13_GZIP=1.

upstream isupipe_app {
    server 127.0.0.1:8080;
    keepalive 256;
}

server {
  listen 443 ssl;
  server_name u.isucon.dev;
  server_name *.u.isucon.dev;

  ssl_certificate     /etc/nginx/tls/_.u.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.u.isucon.dev.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;
  location / {
    try_files $uri /index.html;
  }
  location /api {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://isupipe_app;
  }
}
