# Reference: ISUCON13 official vhost + static/upstream tuning.
# No gzip here — avoids double compression if ISUCON13_GZIP=1.

upstream isupipe_app {
    server 127.0.0.1:8080;
    keepalive 256;
}

server {
  listen 443 ssl;
  server_name u.isucon.dev;
  server_name *.u.isucon.dev;

  ssl_certificate     /etc/nginx/tls/_.u.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.u.isucon.dev.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;

  # Vite-built hashed assets under /assets/ — safe for long cache.
  location ^~ /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }

  location /api {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://isupipe_app;
  }
}
