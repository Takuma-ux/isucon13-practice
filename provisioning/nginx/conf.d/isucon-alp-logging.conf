# ALP-friendly LTSV log format (install: copy to /etc/nginx/conf.d/).
# log_format must live in http {}; this file is included there on Debian/Ubuntu.
#
# Bench analysis (temporary — access_log is off in isupipe vhost by default):
#   1. Copy this file to /etc/nginx/conf.d/
#   2. In the isupipe server block, replace "access_log off;" with:
#        access_log /var/log/nginx/isucon.access.ltsv isucon_ltsv;
#   3. sudo nginx -t && sudo CONFIRM_NGINX_RELOAD=yes systemctl reload nginx
#   4. Run bench, then: alp json --file=/var/log/nginx/isucon.access.ltsv
#   5. Restore "access_log off;" and reload nginx when done.

log_format isucon_ltsv 'time:$time_iso8601\t'
                     'host:$remote_addr\t'
                     'method:$request_method\t'
                     'path:$uri\t'
                     'query:$query_string\t'
                     'status:$status\t'
                     'size:$body_bytes_sent\t'
                     'referer:$http_referer\t'
                     'ua:$http_user_agent\t'
                     'reqtime:$request_time\t'
                     'apptime:$upstream_response_time\t'
                     'vhost:$host';
